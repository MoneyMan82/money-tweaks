name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: Build release
        shell: pwsh
        # Version comes from the tag (v1.24.0 -> 1.24.0, shown as 1.24) so the app, installer and tag can never disagree.
        run: |
          $v = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { '' }
          ./scripts/build-release.ps1 -ReleaseVersion $v
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: Money Tweaks ${{ env.DISPLAY_VERSION }}
          body_path: RELEASE_NOTES.md
          files: |
            dist/MoneyTweaks-Setup.exe
            dist/*.zip
            dist/MoneyTweaks-*-win-x64.exe
            dist/SHA256SUMS.txt
