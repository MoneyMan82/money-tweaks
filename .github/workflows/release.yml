name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
# One release at a time: two tags pushed together used to publish out of order, and GitHub marks the most recently
# published release "latest" (v1.48.0 ended up latest above v1.49.0, so older app versions saw no update).
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refuse a version that isn't newer than the last release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        # The app only offers an update when the latest release is newer than what's installed, so a lower tag
        # (e.g. v1.2.5 after v1.25.1) would become "latest" on GitHub and silently stop all in-app updates.
        # Compared with published releases (tags without a release, like v1.30.0, never reached anyone).
        run: |
          function V($t) { $s = $t.TrimStart('v','V'); if ($s -match '^\d+\.\d+$') { $s += '.0' }; try { [version]$s } catch { $null } }
          $mine = V $env:GITHUB_REF_NAME
          if (-not $mine) { throw "Tag $($env:GITHUB_REF_NAME) isn't a version like v1.26.0" }
          $tags = gh release list --repo $env:GITHUB_REPOSITORY --limit 200 --exclude-drafts --json tagName --jq '.[].tagName'
          $newest = $tags | Where-Object { $_ -ne $env:GITHUB_REF_NAME } | ForEach-Object { V $_ } | Where-Object { $_ } | Sort-Object -Descending | Select-Object -First 1
          if ($newest -and $mine -le $newest) { throw "Tag $($env:GITHUB_REF_NAME) ($mine) is not newer than the existing v$newest. Installed copies would never see it as an update. Use a higher version." }
          Write-Host "Version $mine is newer than v$newest"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: Build release
        shell: pwsh
        # Version comes from the tag (v1.24.0 -> 1.24.0, shown as 1.24) so the app, installer and tag can never disagree.
        run: |
          $v = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { '' }
          ./scripts/build-release.ps1 -ReleaseVersion $v
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: Money Tweaks ${{ env.DISPLAY_VERSION }}
          body_path: RELEASE_NOTES.md
          files: |
            dist/MoneyTweaks-Setup.exe
            dist/*.zip
            dist/MoneyTweaks-*-win-x64.exe
            dist/MoneyTweaks-Linux-x64.tar.gz
            dist/SHA256SUMS.txt
      - name: Keep the highest version marked latest
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          function V($t) { $s = $t.TrimStart('v','V'); if ($s -match '^\d+\.\d+$') { $s += '.0' }; try { [version]$s } catch { $null } }
          $newest = gh release list --repo $env:GITHUB_REPOSITORY --limit 200 --exclude-drafts --exclude-pre-releases --json tagName --jq '.[].tagName' |
            Where-Object { V $_ } | Sort-Object { V $_ } -Descending | Select-Object -First 1
          gh release edit $newest --repo $env:GITHUB_REPOSITORY --latest
          Write-Host "Latest release: $newest"
