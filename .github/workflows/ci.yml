name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build MoneyTweaks.slnx -c Release
      - run: dotnet test tests/MoneyTweaks.Tests -c Release --no-build --logger "trx;LogFileName=results.trx" --results-directory TestResults
      - run: dotnet test tests/MoneyTweaks.Community.Tests -c Release --no-build --logger "trx;LogFileName=community.trx" --results-directory TestResults
      - run: dotnet test tests/MoneyTweaks.Linux.Tests -c Release --no-build --logger "trx;LogFileName=linux.trx" --results-directory TestResults
      - name: Report failed tests as annotations
        if: failure()
        shell: pwsh
        run: |
          foreach ($f in Get-ChildItem TestResults -Filter *.trx -Recurse) {
            [xml]$x = Get-Content $f.FullName
            foreach ($r in $x.TestRun.Results.UnitTestResult | Where-Object outcome -eq 'Failed') {
              $msg = ($r.Output.ErrorInfo.Message + ' | ' + $r.Output.ErrorInfo.StackTrace) -replace '\r?\n', ' '
              if ($msg.Length -gt 900) { $msg = $msg.Substring(0, 900) }
              Write-Output "::error title=$($r.testName)::$msg"
            }
          }
  linux:
    # Money Tweaks for Linux on a real Linux kernel: parsers against the runner's /proc and /sys, then the linux-x64 publish.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test tests/MoneyTweaks.Linux.Tests -c Release --logger "console;verbosity=normal"
      - run: dotnet publish src/MoneyTweaks.Linux -c Release -r linux-x64 --self-contained true -o out
      - run: test -x out/money-tweaks && file out/money-tweaks
  worker:
    # Website Worker with the Community Hub API (worker/): typecheck and tests in the Workers runtime (no Cloudflare account used).
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
